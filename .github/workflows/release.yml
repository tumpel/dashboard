name: release

on:
  workflow_run:
    workflows: [checks]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: taiki-e/install-action@v2
        with:
          tool: convco@0.7.2

      - id: plan
        name: Require exact-source checks, plan and stamp the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:prepare

      - if: steps.plan.outputs.version != ''
        run: npm ci --no-audit --no-fund

      - if: steps.plan.outputs.version != ''
        name: Build, pack, import-check and publish both packages with checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:publish

      - if: steps.plan.outputs.version != ''
        id: dispatch-control-plane
        name: Dispatch component-released to control-plane
        env:
          CONTROL_PLANE_DISPATCH_TOKEN: ${{ secrets.CONTROL_PLANE_DISPATCH_TOKEN }}
        run: npm run release:dispatch
