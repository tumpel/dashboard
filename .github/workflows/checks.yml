name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Detect a docs-only pull request
        id: changes
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { execFileSync } from "node:child_process";
          import { DOCS } from "./npm-scripts/release-plan.mjs";
          const code = process.env.GITHUB_EVENT_NAME !== "pull_request" ||
            execFileSync("git", ["diff", "--name-only", "HEAD^1", "HEAD", "--", ".", ...DOCS], { timeout: 30_000 }).length > 0;
          console.log(`code=${code}`);
          NODE

      - run: npm ci --no-audit --no-fund

      - if: steps.changes.outputs.code == 'false'
        name: Run Biome and the comments, secrets and prose checks
        run: npm run lint && npm run comments:check && npm run secrets:check && npm run prose:check

      - if: steps.changes.outputs.code == 'true'
        run: npm run check

      - if: steps.changes.outputs.code == 'true'
        uses: taiki-e/install-action@v2
        with: { tool: convco@0.7.2 }
      - if: steps.changes.outputs.code == 'true'
        run: npm test

      - if: steps.changes.outputs.code == 'true'
        name: Build and pack the dashboard and pages tarballs, then install and import them
        run: |
          npm run pack
          npm run pack:check

      - if: steps.changes.outputs.code == 'true'
        run: npm run build-storybook

      - if: steps.changes.outputs.code == 'true'
        run: npm run screenshots:mobile:check
