name: checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}

      - name: Detect a docs-only pull request
        id: changes
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            grep -qvE '^(docs?/.*|.*\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*)$' <<<"$changed" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - if: steps.changes.outputs.code == 'false'
        name: Run Biome and the comments, secrets and prose checks
        run: npm run lint && npm run comments:check && npm run secrets:check && npm run prose:check

      - if: steps.changes.outputs.code == 'true'
        run: npm run check

      - if: steps.changes.outputs.code == 'true'
        run: npm test

      - if: github.event_name == 'push'
        id: version
        run: node npm-scripts/release.mjs

      - if: steps.changes.outputs.code == 'true'
        name: Build and pack the dashboard and pages tarballs, then install and import them
        run: |
          npm run pack
          npm run pack:check

      - if: steps.changes.outputs.code == 'true'
        run: npm run build-storybook

      - if: steps.changes.outputs.code == 'true'
        run: npm run screenshots:mobile:check

      - if: steps.version.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with: { name: release, path: release/, if-no-files-found: error }

  candidate:
    needs: check
    if: github.event_name == 'push' && needs.check.outputs.tag != ''
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with: { name: release, path: release/ }
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release create "$TAG" release/* --target "$GITHUB_SHA" --prerelease
